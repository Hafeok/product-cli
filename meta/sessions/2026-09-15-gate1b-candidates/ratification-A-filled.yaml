rules:
- accepting a candidate supplies its act name, what it settles and the principal (CG-R-106); the session fills none
  of these
- expected actor kinds reference Layer 1 kinds; population and rate are orders of magnitude (CG-R-108)
- 'supported throughput is a determination: sustained, peak, window, behaviour above the limit (CG-R-109)'
- channel is a named extent axis (CG-R-107); the Blazor client is an actor kind, not a candidate (CG-R-113)
- a candidate with identity incomplete is accepted only with its route supplied by hand from the source (CG-R-114);
  route_source_reading_for_confirmation is the session's reading, not a supplied route
- a rejection carries a reason (CG-R-106); candidates outside the signal-bearing subset default to the CG-R-115
  reason unless named
