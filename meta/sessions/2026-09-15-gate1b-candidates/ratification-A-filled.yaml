  reject_reason: static-file fallback; serves an asset and settles no determination. Rejected by judgement on the
    single row, not by a category rule (CG-R-112).
ratification_notes:
  grade: stand-in (CG-R-115). Every figure computed against this set carries it.
  accepted: 22
  rejected_in_subset: 3
  deferred: 1
  merges_found:
  - EndSession — UserController.Logout#POST and LogoutModel@Account.OnPost#POST. Two entry points, one act, same
    actor kind, same channel. The first genuine merge in the set.
  - ReadUserDetails — UserGetByIdEndpoint and UserGetByUserNameEndpoint. Same determinations, same actor, differing
    only in lookup key.
  overlaps_that_are_not_merges:
  - 'The cross-host trio is three acts, not one (CG-R-117): ReadCurrentActorIdentity, EndSession and EstablishSession
    share identity types, which is shared realisation (CG-R-116).'
  - ReadBasket and ReadBasketSummary are two read models over the same facts.
  scale_and_throughput_not_supplied: 'Population, rate and supported throughput are null with a stated reason on
    every accepted row. A has no deployment; population and rate are facts about a running system and throughput
    is a commitment requiring a principal who can make it. Consequence: the scale-weighted uncovered list of CG-R-110
    cannot be computed for A, and any figure resting on scale is unavailable rather than zero.'
  findings:
  - ConfirmEmailAddress is a GET that changes state. Transport verb and act disagree; R-B settles it in the act's
    favour and the transport is the defect.
  - 'EstablishSession is accepted on the api-jwt channel only. Its cookie-channel counterpart (the Login page) is
    not in the signal-bearing subset, so the channel axis is half-populated in this ratification. That is a finding
    about what the overlap signal selects, not about the codebase: the two channels do not share types, so no overlap
    flagged them.'
  - Three of the four rejections in the subset are GET handlers that render an affordance for a POST that carries
    the act. A page render is not always an act, and the signal-bearing selection cannot tell them apart.
  - One row failed route confirmation and is deferred; see its reject_reason.
  unratified_remainder: 43 rows keep the CG-R-115 default. None was overridden. Notable among them is the cookie-channel
    login, per the findings above.
