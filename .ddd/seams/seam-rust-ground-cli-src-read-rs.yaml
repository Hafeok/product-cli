verdict_knowledge: 'Callers learn what a codebase yielded and what the instrument managed to ask. Every read is gated by the capability probe first, so an operation that did not answer is not called and its absence travels with the facts — a mapping row can then report why it found nothing. The boundary cannot tell a domain type from infrastructure, cannot see visibility, and cannot recognise generated code: none of that is on the declaration surface, so all of it reaches the proposal and is reported rather than filtered. What it does measure it measures rather than assumes — partial declarations apart from name collisions, nested types, field members, operations no row consumes.'
