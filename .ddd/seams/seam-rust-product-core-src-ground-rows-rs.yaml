verdict_knowledge: 'Callers learn the §5.2 extraction table as data: one row per code structure, each naming the operations it cannot fire without, the assurance its output carries, and the provenance a Reading through it gets. A row is never silently empty — the four outcomes are distinct and stay distinct. The boundary asserts nothing about a codebase; it is the table, and a change to it is a change to what extraction claims.'
