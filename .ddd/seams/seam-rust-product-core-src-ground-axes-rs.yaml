verdict_knowledge: "Callers learn that §5.2's assurance mark is two marks: derivation confidence — how reliably the instrument read the code, ordinal, with the value set the earlier single column already carried — and domain relevance — whether the result is the kind of thing the registry is for, with `unknown` an honest mark rather than a missing one. The boundary also publishes that the two are not the same kind of scale: confidence orders, relevance is a verdict that may be undetermined, and a basis says which. Nothing here asserts anything about a codebase; a change to the value sets is a change to what every extracted assertion claims."
