verdict_knowledge: "Callers learn how a proposal is grouped for review: a batch is the set of assertions sharing both marks, the row, the rule, and the source kinds, carrying a bounded sample beside the full member list, in a total order two runs over the same facts agree on. The boundary publishes the reviewer's unit of work at volume — not which assertions are worth ratifying, only which were read the same way about the same kind of thing."
