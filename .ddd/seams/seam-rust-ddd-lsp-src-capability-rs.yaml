format: 2
id: seam/rust/ddd-lsp-src-capability-rs
boundary: contract surface of ddd-lsp/src/capability.rs
verdict_knowledge: 'Callers learn whether an operation is usable, and they learn it from a live call rather than from the server''s advertisement. `available` reads the probe result and never the flag, so an operation advertised and silent reads UNAVAILABLE — the over-advertising shape, flagged by name because it is the one that fabricates ground: a gate reading as passed with zero edges extracted, whose absence a later comparison would read as divergence. The boundary cannot tell a caller *why* an operation is silent, and it cannot distinguish a genuinely empty result from a broken one at any position other than the anchor: it probes one known type declaration, and a file with no type declaration yields no anchor and five unprobed rows rather than five absences. It performs no retry, caches nothing, and reprobing after a host restart is the caller''s to do.'
contract_location: ddd-lsp/src/capability.rs
