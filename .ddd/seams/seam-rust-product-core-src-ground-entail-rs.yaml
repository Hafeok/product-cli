boundary: contract surface of product-core/src/ground/entail.rs
verdict_knowledge: 'Callers learn the graph stage as one act with a measurement attached. Rules are parsed once and cloned per round, so the reported wall-time measures execution rather than parsing — the figure `g-dec-02`''s revisit_if is read against. Every CONSTRUCT is drained before insert because the triple iterator borrows the store. What comes back is only what the rules propose: an assertion recomputable from the proposal set is entailed, counted, and never returned for storage, per the rule that entailments do not enter the authority repo. The boundary writes no file and serialises nothing.'
