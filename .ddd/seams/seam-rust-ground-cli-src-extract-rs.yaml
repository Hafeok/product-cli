id: seam/rust/ground-cli-src-extract-rs
boundary: contract surface of ground-cli/src/extract.rs
verdict_knowledge: 'Callers learn one act: read a codebase, plan a proposal, gate it, write it. The order is the promise — nothing reaches the instance''s working tree until the plan has passed the instance''s own shapes, so a reviewer never reads per-triple diffs of content the registry''s CI would reject. The boundary cannot ratify: it writes files on a branch and nothing else, never merges, never pushes, never touches a path outside the instance directory. It also cannot decide what an instance is: the base IRI is read from the instance''s own birth provenance and a missing or silent one is an error, never a default.'
