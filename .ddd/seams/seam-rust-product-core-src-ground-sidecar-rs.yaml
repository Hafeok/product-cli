boundary: contract surface of product-core/src/ground/sidecar.rs
verdict_knowledge: 'Callers learn where extraction evidence lives and what it may contain: one file per run, pinned to the corpus ref, carrying each assertion''s derivation on the assertion''s own content-addressed node, outside the ratified graph. The boundary publishes that evidence is regenerable rather than authored — so a cohort ratified before the layer existed can be given its derivation without a rewrite — and that an entry either resolves to an assertion or is reported as an orphan.'
