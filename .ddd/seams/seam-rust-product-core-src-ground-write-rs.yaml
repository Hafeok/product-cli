verdict_knowledge: 'Callers learn that a registry authority file comes from this writer and never from a general RDF serialiser, which is not order-stable and re-mints blank-node labels. Fixed field order, sorted evidence, no blank nodes, one assertion per file: the same assertion is the same bytes every time, whatever order its evidence arrived in. An IRI whose local part a prefixed name cannot carry falls back to the full form rather than being rewritten into something that parses differently. The boundary writes no file itself — it renders text.'
