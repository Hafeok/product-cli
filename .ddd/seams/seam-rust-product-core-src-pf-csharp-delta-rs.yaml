boundary: contract surface of product-core/src/pf/csharp_delta.rs
verdict_knowledge: 'The C# stack binding''s consumer surface (Gate 1a): callers learn that an inventory is refused by version before it is read; that reachability is walked through the container''s registration facts as one graph, with every interface-mediated edge the resolver cannot follow recorded by reason and never folded into unreached; that the delta is indexed by act and prints its proxy (CG-R-52) and its authored attribution rule (CG-R-57) on every report; and that no output lists symbols as candidate slices. What it cannot tell them: whether the act vocabulary is right, whether the resolver''s idioms cover the container in use, or whether a declared symbol does what its determination says.'
