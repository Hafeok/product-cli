format: 1
id: seam/rust/default-command
boundary: const DEFAULT_COMMAND in ddd-lsp/src/adapter/rust.rs
verdict_knowledge: A consumer learns which binary this adapter expects to speak LSP to, so it can vendor, pin, or containerise that binary without reading the adapter source. Publishing it as a slice of arguments rather than a command string also encodes that the host is invoked argv-shaped, never through a shell, which is what makes the value safe to hand to a process spawner unquoted.
contract_location: ddd-lsp/src/adapter/rust.rs#DEFAULT_COMMAND
obligations:
- the value stays in step with ADAPTER.default_command — they are the same command, named once
- any change to it is a change to what a governed repo must have installed, so it carries a seam amendment
