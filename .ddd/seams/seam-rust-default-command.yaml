  symbol: host_command
  visibility: public
notes: 'The metadata block on this entry is known-wrong and is left in place as evidence, not as a record. It carries symbol: host_command, kind: fn, signature: fn host_command() -> Vec<String> — the facts of a different symbol in the same file. Cause: enforce-mode match_declarations still admits the file arm, so the second surface event of the same edit matched this declaration by filename and link_seam_metadata then wrote that event''s facts here. See seam-event/4, whose linked_declaration names this entry while its symbol is host_command. That is verbatim the falsifier dec/ddd/enforce-matching-tightens-to-symbol pre-registered for itself, and the corruption of a machine-authored field is what DDD-arch-04 says makes the correspondence dataset unfalsifiable. Correct on the same commit as that decision; correcting it earlier would delete the observation.'
