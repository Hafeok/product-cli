id: seam/rust/ddd-core-src-revisit-rs
boundary: contract surface of ddd-core/src/revisit.rs
verdict_knowledge: "A caller learns that a .ddd reopen edge always pins (an unpinned tripwire cannot fire), that a claim is ground or tripwire and never both, and that a fired edge is a reopen finding whose message never says basis loss. It also learns what it does not do: firing means the decision is due a fresh look, not that its ground moved."
