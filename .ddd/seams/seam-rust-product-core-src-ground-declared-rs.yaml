id: seam/rust/product-core-src-ground-declared-rs
boundary: contract surface of product-core/src/ground/declared.rs
verdict_knowledge: 'Callers learn the three declared rows and the gate they share. A row whose operation did not answer yields nothing and says which operation by name; a row past the gate with nothing to read says it found nothing. Those are different findings and the boundary never collapses them. A property''s range resolves to a declared type or a mapped primitive, and to nothing at all otherwise — an unranged property is a legible gap where a guessed range would be a claim about the domain nobody made. A property derived from a field is proposed *and* named, because the row cannot split implementation from structure and a reviewer batching them needs the list, whole rather than sampled. The boundary judges nothing about relevance: it maps what the language declares.'
