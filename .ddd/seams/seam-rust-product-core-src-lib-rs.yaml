verdict_knowledge: 'Consumers learn product-core carries ground-registry generation alongside the framework graph, and now the code-extraction slice beside it. Both publish their acts and nothing else — plan, apply, check, render — so how a template is rendered, how a gate is spelled, how a mapping row is written and how the fixpoint is driven stay crate-internal. Neither reaches a language server: extraction takes its facts as plain data, which is what keeps this crate free of the governance stack for a downstream consumer.'
