id: seam/rust/product-core-src-ground-facts-rs
boundary: contract surface of product-core/src/ground/facts.rs
verdict_knowledge: 'Callers learn the seam between the half of extraction that knows about language servers and the half that knows about ontology: language-neutral, dependency-free, and the reason `product-core` needs no LSP client of its own. Nothing here is inferred — a fact is present because an operation answered, and which operations answered is itself a recorded fact, so an absence the instrument caused can never read as an absence the codebase has. The boundary carries no position beyond a declaration''s span: a column belongs to the reader, never to a fact that will be ratified.'
