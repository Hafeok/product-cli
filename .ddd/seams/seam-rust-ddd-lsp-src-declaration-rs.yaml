format: 2
id: seam/rust/ddd-lsp-src-declaration-rs
boundary: contract surface of ddd-lsp/src/declaration.rs
verdict_knowledge: 'Callers learn the six declaration-level operations as functions over a host, each returning a normalised shape rather than raw JSON, and learn that `Operation` is the closed vocabulary the extractor''s mapping rows and the capability probe both name. Type-hierarchy is three calls, not one: prepare yields an item that the two directional calls take back. The boundary asserts nothing about availability — a host that does not answer returns an empty vector here, and only `capability::probe` distinguishes that from a real absence. It is deliberately not the whole protocol: no completion, no refactoring, no diagnostics, because holding the extractor to the declared surface is what keeps adapter maturity off it.'
