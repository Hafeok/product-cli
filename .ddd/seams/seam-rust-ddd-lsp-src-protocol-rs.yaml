id: seam/rust/ddd-lsp-src-protocol-rs
boundary: contract surface of ddd-lsp/src/protocol.rs
verdict_knowledge: 'Callers learn that a type-hierarchy item carries symbol identity — name, kind, detail — beside its range, which the location normaliser would have dropped, and that `hierarchy_params` returns the server''s own item **verbatim**: `raw` is the value as it arrived, so an opaque `data` blob and any field a future server adds survive the round trip that the directional calls depend on. The boundary interprets no `data` and cannot: its contents are the server''s business, and a caller that rebuilds an item instead of carrying it gets an empty result rather than an error. A `null` result normalises to an empty vector, which is not itself evidence of anything — that judgement belongs to the capability probe.'
