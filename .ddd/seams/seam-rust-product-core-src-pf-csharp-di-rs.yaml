id: seam/rust/product-core-src-pf-csharp-di-rs
boundary: contract surface of product-core/src/pf/csharp_di.rs
verdict_knowledge: 'Callers learn that DI resolution reads only the registration facts the reader recorded, through a stated list of container idioms, and that an edge it cannot follow is answered with a reason rather than dropped — keyed, decorated, conditional, module-configuration (site never reached), factory, assembly-scanning (an implementor lives in a scanned project), or no registration. What it cannot tell them: whether the idiom list covers the container a given solution uses; the ignored-call distribution is where that answer starts.'
