format: 2
id: seam/rust/ledger-core-src-show-rs
boundary: contract surface of ledger-core/src/show.rs
verdict_knowledge: "A caller learns that a decision screen is assembled from the same View the gate reads, so show can never disagree with verify about state; that a selector (one id, a set, a weight class) covers a pass in one traversal; and that the weight class is derived from the discharge rather than listed, so it cannot go stale. It also learns the limit: ledger-core resolves no basis argument itself — it takes a BasisText resolver as an input, and with NoText the pointers render bare."
contract_location: ledger-core/src/show.rs
obligations: []
