verdict_knowledge: "Callers learn that a proposal takes both grades, the relevance basis, the provenance and the method from the §5.2 row that produced it, never from the caller. No mapping rule can quietly claim a confidence its row does not justify, and none can claim a relevance nobody computed. What the caller does supply is the derivation — the rule, the operations, the source kinds — because that varies per assertion where the row's marks do not. The boundary cannot invent evidence: what it cites is what it was handed."
