format: 2
id: seam/rust/ground-cli-src-symbols-rs
boundary: contract surface of ground-cli/src/symbols.rs
verdict_knowledge: 'Callers learn a file''s declarations, their members with the kind the server reported, and the anchor each declaration''s own name sits at — the anchor being what the position operations need and what a citation must not carry. A member rendered without a type is skipped rather than guessed at, and a nested type''s module is its enclosing namespace rather than its outer type. The boundary reports a member kind, never a judgement: field and property are what the server said, and it cannot see visibility, so it cannot tell implementation from domain structure. It reads one file''s symbol tree and nothing else — no name resolved across files, no reference followed.'
