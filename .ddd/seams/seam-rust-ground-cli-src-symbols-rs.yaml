verdict_knowledge: 'Callers learn a file''s declarations, their members, and the anchor each declaration''s own name sits at — the anchor being what the position operations need and what a citation must not carry. A member the server rendered without a type is skipped rather than guessed at, and a nested type''s module is its enclosing namespace rather than its outer type. The boundary reads one file''s symbol tree and nothing else: it resolves no name across files, follows no reference, and knows nothing about any other declaration.'
