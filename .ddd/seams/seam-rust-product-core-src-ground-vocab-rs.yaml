verdict_knowledge: 'Callers learn the terms extraction writes, as full IRIs rather than prefixed names, so a prefix change can never silently retarget an assertion. The primitive-to-datatype map is deliberately partial: a type it does not name yields a property with no range rather than a guessed one. The boundary defines vocabulary and decides nothing about when a term applies.'
