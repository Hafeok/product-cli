verdict_knowledge: 'Callers learn the extraction slice as three acts — plan, apply, render — with the types they carry, and learn that the path is model-free by ruling: extraction is constructively closed, so there is no candidate-generation step for a model to do. The slice reads no language server; the reading half fills the facts and hands them over, which is what keeps the downstream-consumer contract intact. Its output is a proposal and never ground: ratification is a reviewer merging one file at a time.'
