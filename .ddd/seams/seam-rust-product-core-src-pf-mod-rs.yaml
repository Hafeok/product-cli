verdict_knowledge: 'The C# stack binding''s consumer surface: callers learn that the inventory is refused by version before it is read, that reachability is always reported with the root convention and DI flag that produced it, and that the delta is indexed by act — no output lists symbols as candidate slices (R-D). What it cannot tell them: whether the act vocabulary is right, or whether a declared symbol does what its determination says.'
