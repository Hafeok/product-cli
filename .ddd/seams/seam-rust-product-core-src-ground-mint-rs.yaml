verdict_knowledge: 'Callers learn that an assertion''s identity is derived from the triple it asserts and from nothing else — not the run, not the as-of, not the assurance. That is what makes a re-run at the same ref propose nothing, a re-run at a later ref propose only what changed, and a disappeared symbol leave a ratified file with no counterpart. The boundary cannot mint an identity that survives a change to the triple, and it should not: a changed triple is a different assertion. Local names are folded to one safe alphabet rather than trusted, because namespaces and generics reach it.'
