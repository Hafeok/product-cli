verdict_knowledge: 'A handler author learns that this argument surface has two reading disciplines and must choose between them: opt_str normalises, raw_str does not. Publishing the second one makes the choice visible at the call site instead of leaving every handler to inherit trimming it never asked for — which is how apply_edit came to delete the trailing newline of every file it wrote, in every language, silently.'
