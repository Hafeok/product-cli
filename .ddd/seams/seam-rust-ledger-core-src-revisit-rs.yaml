verdict_knowledge: "A caller learns that a reopen pointer is its own type, RevisitRef, and cannot be passed where a basis is expected — the 2026-08-13 ruling made structural rather than conventional. It also learns what the type does not do: the vocabulary is open at L0, exactly as based_on's is, so nothing here resolves a pointer or proves the claim it names exists."
