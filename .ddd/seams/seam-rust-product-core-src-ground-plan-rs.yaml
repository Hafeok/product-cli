verdict_knowledge: 'Callers learn everything a reviewer will see, decided before anything is written: which rows fired, which found nothing, which were gated off, which are not derivable at all, and one file per proposed assertion. It is pure — no I/O, no clock of its own, so the same facts with the same as-of plan the same bytes. An already-ratified id is dropped rather than re-proposed, because re-emitting it would rewrite ratified content rather than add to it. The boundary decides nothing about acceptance: it proposes, and a merge ratifies.'
