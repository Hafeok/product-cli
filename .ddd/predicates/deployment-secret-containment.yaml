predicate:
  id: pred/configuration/deployment-secret-containment
  format: 1
  name: Deployment secret containment
  statement: >
    Accept an infrastructure template c iff no value that is a secret leaves
    c through a deployment output, a log, or a non-secure parameter — where
    which values are secrets is stated in G rather than guessed from their
    names.

  artifact_class: configuration

  ground:
    - fact: the parameters, outputs and their annotations in c
      provenance: controlled
    - fact: which of those values are in fact secrets
      provenance: institutional
    - fact: whether a leaked value was read from the deployment history
      provenance: observed

  tolerance: >
    No secret reachable through an output or an unannotated parameter. A
    value whose secrecy is not annotated is treated as a reject rather than
    as not-a-secret, because the annotation is the only thing that makes
    secrecy checkable.

  rejection_witness: >
    The output or parameter, and the secret-annotated value that reaches it.

  depends_on: []

  closure_claims:
    - DDD-bicep-sec-01   # annotated secrets are contained, by two tools
    - DDD-bicep-sec-02   # ...and the annotation itself rests on a name heuristic

  proxy_gap: >
    Annotation coverage proxies secret containment. Everything downstream —
    output checks, secure-value checks — keys off the annotation, so the
    predicate is only as good as the step that decides what gets annotated,
    and that step is not itself checkable.

  notes: >
    The institutional ground item is why the tolerance treats an
    unannotated value as a reject: what counts as a secret is knowledge the
    template does not contain. That decision has to enter the artifact from
    outside, and the tooling can only enforce consequences once it has.
