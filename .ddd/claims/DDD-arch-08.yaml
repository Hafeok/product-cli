format: 2
id: DDD-arch-08
statement: >
  MCP-path interception alone is not a repository enforcement boundary: it
  governs only edits volunteered through ddd_apply_edit, so a
  contract-surface change made outside the MCP path (editor, CLI, git) is
  never classified, never demanded, and produces no finding later.
status: reported
evidence: >
  The architecture itself. Interception binds edits arriving through
  ddd_apply_edit (ddd-mcp/src/intercept.rs); nothing binds an edit to
  arrive that way, and neither `ddd diff` nor `ddd report escapes`
  computes contract-surface coverage after the fact. The M6 report §5.3
  ("routing to the interceptor is voluntary") states the same limit for
  the tool's own repo. Reported by the 2026-08 PRD review
  (docs/reviews/ddd-cli-prd-review-2026-08.md).
falsifier: >
  A demonstration that every contract-surface change in a governed repo
  necessarily routes through ddd_apply_edit — an edit-path inventory
  showing no write path (editor, CLI subcommand, direct git) reaches
  contract surface ungoverned.
owner: none
changed: 2026-08-11
revalidate_by: 2027-02-11
