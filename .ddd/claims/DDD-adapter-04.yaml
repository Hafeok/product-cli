format: 2
id: DDD-adapter-04
statement: >
  Adding a language costs more than an adapter plus a policy table whenever
  the new host's *lifecycle* protocol differs in shape from the incumbents'.
  The contract-surface half of PRD §11's mitigation held for Rust — every
  Rust semantic assumption landed inside the adapter module — but the host
  half did not: two assumptions about how a language server announces itself
  were baked into the language-neutral LSP layer and had to be generalised
  before the third adapter could be written at all. DDD-adapter-01 does not
  cover this, because its falsifier is scoped to contract-surface knowledge
  and says nothing about host wiring.
status: reported
evidence: >
  Measured at M6 against rust-analyzer 1.95.0, with a pre-registered
  classification filed before any code was written
  (docs/ddd-m6-experiment.md, commit a8871da).


  Assumption 1 — one fixed client-capability set serves every host.
  `ddd-lsp/src/host.rs::initialize` sent a capability literal with no adapter
  hook. rust-analyzer emits `experimental/serverStatus` only when the client
  declares `experimental.serverStatusNotification: true`; probed both ways
  against the same crate, the capability yields the notification at t+0.15s
  and its absence yields zero such notifications for the life of the process.
  Fix: `Adapter::extra_capabilities`, deep-merged over the common set.


  Assumption 2 — readiness is the arrival of a distinctly-named notification.
  That is Roslyn's shape: `workspace/projectInitializationComplete` is sent
  once and means ready, so `ServerState::flags` recorded method names only.
  rust-analyzer repeats one method and carries the answer in the payload —
  `quiescent: false` at t+0.15s, `quiescent: true` at t+3.92s — so a
  name-only flag reports Ready while the index is still building, which is
  the exact dishonesty `Readiness::Loading` exists to prevent. Fix: a
  `ReadySignal` variant taking a payload predicate, plus
  `ServerState::last_params`.


  Cost: 66 added / 6 deleted in adapter/mod.rs, 33/19 in host.rs, 9/0 in
  client.rs, 3/2 each in the C# and Bicep adapters to restate one field —
  about 114 added lines outside the new adapter, against 840 inside it.
  Nothing in the interceptor, the classifier, the surface vocabulary, the MCP
  layer, or the config schema had to move.
falsifier: >
  A fourth language whose host needs neither a capability announcement of its
  own nor a readiness shape outside the two now expressible — i.e. the
  generalisation made at M6 turns out to have been the last one, and the LSP
  layer absorbs new hosts without further change. Equally falsified if the
  two changes are shown to have been avoidable: a readiness signal for
  rust-analyzer that is both honest about indexing and expressible as a bare
  notification method name.
