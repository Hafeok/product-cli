format: 2
id: DDD-arch-09
statement: >
  Session-scoped declaration matching admits discharge of unidentified
  changes: a seam declaration matches by symbol within the serving
  session, so it discharges whatever change next touches that symbol —
  the declaration never identifies, by content, the specific change it
  was written for.
status: reported
evidence: >
  The matching implementation: intercept.rs links declarations to surface
  events by symbol (the file arm dropped at enforce per
  dec/ddd/enforce-matching-tightens-to-symbol), with no subject content
  hash and no base revision on the declaration — any same-session edit
  touching the declared symbol is applied-linked. Reported by the 2026-08
  PRD review (lands at docs/reviews/ddd-cli-prd-review-2026-08.md;
  document pending receipt).
falsifier: >
  A demonstration that symbol-scoped session matching cannot link a
  declaration to a change other than the one it was written for — e.g.
  matching shown to already compare change content, or a proof that at
  most one change per symbol can occur within a session.
owner: none
changed: 2026-08-11
revalidate_by: 2027-02-11
depends_on: []
