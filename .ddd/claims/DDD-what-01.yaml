id: DDD-what-01
statement: >
  The framework's own §-numbered boundary vocabulary — system (§3.2.5),
  context mapping (§3.1), journey crossing (§3.0.1), quality demand (§3.6) —
  marks where irreversible commitment concentrates in a What graph, so a
  policy table over those kinds selects the elements worth a declaration.
status: projected
falsifier: >
  A graph where the boundary defects that actually bit originated in kinds
  the table calls internal elaboration — an entity, a read-model, a UI step —
  rather than in the kinds it calls surface.
owner: Emil
