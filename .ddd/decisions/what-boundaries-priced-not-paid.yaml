  exposure and the 2027-02-07 review date. DDD-what-04 is retained as a
  secondary claim basis, pin unchanged: unlike the audit's other
  manufactured citations it is genuinely load-bearing — it bounds the
  exposure (demonstration content, no second party) and carries the review
  date mechanically through its `revalidate_by`. Format 2 -> 5 per
  docs/ddd-format-migrations.md. Awaiting the principal's ruling.
