  at. Also noted at ratification: the entry's assertion that the flip condition
  is filed nowhere in this repository was true against the tree at a8871da and
  is stale now — canon was synced afterwards (e90e6ea) and the condition is
  filed in the PRD M7 row. The entry stands as the record of what was known at
  ruling time, which the principal ruled was its whole value.

  Basis re-affirmed again 2026-08-10 (Emil), at M7's acceptance:
