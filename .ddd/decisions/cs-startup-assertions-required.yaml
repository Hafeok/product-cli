format: 2
id: dec/cs/startup-assertions-required
title: Assertion-closed obligations must be asserted in a test, not merely available
rationale: >
  Two obligations in this catalog are closable by walking a built object
  rather than by a rule: AutoMapper's member coverage
  (AssertConfigurationIsValid, DDD-cs-map-01) and EF concurrency-token
  presence per entity (DDD-cs-conc-02). Both close nothing unless the
  assertion actually runs, which makes them the most likely entries in the
  catalog to be recorded as closed while being inert.


  So the decision is not "these are closable" — the claims already say that —
  but that a governed repo runs them as a test that fails the build, not as a
  startup nicety that a misconfigured environment can skip. A mapper
  configuration validated only in Development, or a model assertion nobody
  invokes, leaves the obligation open while the catalog says otherwise.


  Which entities need a concurrency token stays with judgment; the assertion
  checks the ones the repo declares should have one, and its value is that
  the declared set cannot silently empty.


  Scope: governed C# engagement repos that use either library.
principal: Emil (Context&)
