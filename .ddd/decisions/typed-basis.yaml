format: 5
id: dec/ddd/typed-basis
title: A decision's basis is typed; non-claim bases are first-class
rationale: >
  The basis vocabulary is claim | constraint | mandate | preference |
  experiment | risk-acceptance. The basedOn -> claim edge remains
  load-bearing where a claim is the basis; the other types become honest
  first-class bases instead of manufactured claims. Forcing claim-basis
  where none exists manufactures weak claims to pass validation — the
  exact corruption the graph exists to prevent. Ruled at the 2026-08 PRD
  review; shipped as decision format 5 with ontology rule 3 restated to
  "every decision has >=1 typed basis".
principal: Emil (Context&)
based_on:
  - type: claim
    claim: DDD-method-06
    status: projected
    changed: 2026-08-11
date: 2026-08-11
notes: >
  The pleasing recursion, on record: this is the first decision entitled
  to a non-claim basis type, and its honest basis is a claim — the
  manufactured-claims finding above — so a claim basis is correct for it.
  Filed at format 5, the format this ruling produced. Awaiting the
  principal's per-entry ratification (M5 batch discipline).
