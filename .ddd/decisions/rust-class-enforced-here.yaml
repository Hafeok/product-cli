    ref: docs/ddd-m6-experiment.md
date: 2026-08-10
notes: >
  The friction reading this produces is optimistic by a known amount:
  `dec/ddd/enforce-matching-tightens-to-symbol` is deliberately not
  implemented in this session, so enforce-mode matching still admits the file
  arm. See docs/ddd-m6-experiment.md §1.1.


  Basis re-typed 2026-08-12, following the 2026-08 basis-quality audit
  (F-7f): a re-decision of the basis per format 5, not an edit. The
  rationale is honestly self-described — "running the tail of this session
  governed is the first live reading of the friction falsifier on a real
  repo" — which is the experiment type: adopted to find out. The prior
  citations of DDD-friction-01 and DDD-friction-02 are dropped as bases
  and named in the experiment statement instead: they are the claims this
  decision exists to test, not claims it rests on — its own rationale says
  both "have no ground in this repo at all", so a decision resting on them
  would invert the direction of evidence. Neither claim is retired here;
  claim fates are the F-batch's. Format 2 -> 5 per
  docs/ddd-format-migrations.md. Awaiting the principal's ruling.
