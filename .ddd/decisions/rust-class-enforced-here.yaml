notes: >
  The friction reading this produces is optimistic by a known amount:
  `dec/ddd/enforce-matching-tightens-to-symbol` is deliberately not
  implemented in this session, so enforce-mode matching still admits the file
  arm. See docs/ddd-m6-experiment.md §1.1.
