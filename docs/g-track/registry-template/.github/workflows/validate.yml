# SHACL validation on every change (PRD §3, authority row; G-1 session prompt step 3.2).
# Shapes start minimal — the §4.1 Reading tuple constraint, structural
# well-formedness, the decision shape — and grow at G0.
#
# Format: Turtle (G-1 Gate 3 ruling) — the authority file is the assertion,
# SHACL reads it directly, zero conversion in CI.
#
# File rule (one rule, no exemptions):
#   - every graphs/**/*.ttl carries exactly one assertion OR exactly one
#     decision. Nothing else, and never both.
#   - `_`-prefixed files are exemplars: validated like any other file, excluded
#     from projection builds.
#   - the rule is scoped to graphs/. runs/ holds per-run *evidence*, not
#     ratified content: it carries no assertion and no decision, which is why
#     it lives outside graphs/ rather than inside it with an exemption.
#
# SHACL runs over the JOIN — graphs/ + runs/ + vocabulary/ — because that is
# what a consumer reads, and because the derivation half of an assertion's
# shape lives in the run evidence. Validating graphs/ alone would pass shapes
# the projection then fails, which is precisely the interaction 0.3.0's
# class-targeted shapes exist to keep from recurring.
#
# The rule used to exempt graphs/canonical/founding-decision.ttl by filename so
# an empty slot could ship. The exemption was generalised into the rule it stood
# in for, and the empty file went with it: the founding decision is created by
# the ratifier who files it, so there is no empty file to tolerate.

name: validate
on:
  push:
  pull_request:

jobs:
  shacl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validators
        run: pip install pyshacl rdflib
      - name: One assertion or one decision per file
        run: |
          python - <<'EOF'
          import glob, sys
          from rdflib import Graph
          from rdflib.namespace import RDF, Namespace
          REG = Namespace("https://REGISTRY-HOST.example/ns#")
          bad = []
          for path in glob.glob("graphs/**/*.ttl", recursive=True):
              g = Graph(); g.parse(path, format="turtle")
              assertions = set(g.subjects(RDF.type, REG.Assertion))
              decisions = set(g.subjects(RDF.type, REG.Decision))
              counts = (len(assertions), len(decisions))
              if counts not in ((1, 0), (0, 1)):
                  bad.append(
                      f"{path}: {counts[0]} assertion(s), {counts[1]} decision(s) "
                      "— exactly one assertion or exactly one decision required"
                  )
          if bad:
              print("\n".join(bad)); sys.exit(1)
          print("one-assertion-or-one-decision-per-file: ok")
          EOF
      - name: Sidecar entries resolve
        run: |
          python - <<'EOF'
          import glob, re, sys
          from rdflib import Graph
          from rdflib.namespace import RDF, Namespace
          REG = Namespace("https://REGISTRY-HOST.example/ns#")
          ratified = set()
          for path in glob.glob("graphs/**/*.ttl", recursive=True):
              g = Graph(); g.parse(path, format="turtle")
              ratified |= {str(s) for s in g.subjects(RDF.type, REG.Assertion)}
          runs = sorted(glob.glob("runs/**/*.ttl", recursive=True))
          if not runs:
              print("sidecar entries resolve: no run evidence yet"); sys.exit(0)
          total = 0
          for path in runs:
              g = Graph(); g.parse(path, format="turtle")
              named = {str(s) for s in g.subjects(REG.derivedByRule, None)}
              orphans = sorted(named - ratified)
              total += len(orphans)
              print(f"{path}: {len(named)} entr(ies), {len(orphans)} orphan(ed)")
              for o in orphans:
                  print(f"  orphan: {o}")
          # Identity is content-addressed, so an orphan is a real finding: a run
          # against the wrong instance, or evidence for a rejected proposal.
          sys.exit(1 if total else 0)
          EOF
      - name: SHACL
        run: |
          python - <<'EOF'
          import glob, sys
          from pyshacl import validate
          from rdflib import Graph
          data = Graph()
          for pattern in ("graphs/**/*.ttl", "runs/**/*.ttl", "vocabulary/**/*.ttl"):
              for path in glob.glob(pattern, recursive=True):
                  data.parse(path, format="turtle")
          shapes = Graph()
          for path in glob.glob("shapes/*.ttl"):
              shapes.parse(path, format="turtle")
          conforms, _, text = validate(data, shacl_graph=shapes, advanced=True)
          print(text)
          sys.exit(0 if conforms else 1)
          EOF
