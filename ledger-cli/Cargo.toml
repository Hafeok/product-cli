[package]
name = "ledger-cli"
version = "0.6.0"
edition = "2021"
authors = ["PiCloud Contributors"]
license = "Apache-2.0"
description = "Decision Ledger CLI: the L0 format gate over the repo-local .decisions/ log."
repository = "https://github.com/Hafeok/product-cli"
homepage = "https://github.com/Hafeok/product-cli"
readme = "../README.md"

[[bin]]
name = "ledger"
path = "src/main.rs"

[lints]
workspace = true

# Kept out of the cargo-dist release set for L0 so adding the binary does not
# silently change the published artifact list; revisit when `ledger` ships.
[package.metadata.dist]
dist = false

[dependencies]
ledger-core  = { path = "../ledger-core", version = "0.6.0" }
chrono       = "0.4"
clap         = { version = "4", features = ["derive"] }
serde_json   = "1"

[dev-dependencies]
assert_cmd  = "2"
serde_json  = "1"
serde_yaml  = "0.9"
predicates = "3"
tempfile   = "3"
